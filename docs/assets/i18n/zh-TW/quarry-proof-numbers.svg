<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="1600" height="820" role="img"
     aria-labelledby="pnt pnd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <title id="pnt">Quarry research outcomes</title>
  <desc id="pnd">Internal blinded evaluations. Quarry produced 2.08 evidence-backed discoveries per research run, removed or fixed 81.7 percent of unsupported claims after source verification, caught 100 percent of planted citation and source errors, identified 34 opportunities rated 8 out of 10 or higher, and produced complete proof trails for 100 percent of runs.</desc>

  <rect width="1600" height="820" rx="18" fill="#05070b"/>
  <rect x="20" y="20" width="1560" height="780" rx="14" fill="#0a0e15" stroke="#253044" stroke-width="2"/>
  <path d="M64 104H1536 M64 408H1536 M548 138V408 M1052 138V408" stroke="#182131" stroke-width="1"/>
  <text x="64" y="76" font-size="20" font-weight="700" letter-spacing="1.8" fill="#6f819a">QUARRY · 內部盲測評估</text>
  <line x1="64" y1="104" x2="1536" y2="104" stroke="#253044" stroke-width="2"/>

  <!-- Top row -->
  <rect x="64" y="138" width="464" height="270" rx="8" fill="#0d131d" stroke="#253044"/>
  <rect x="568" y="138" width="464" height="270" rx="8" fill="#0d131d" stroke="#253044"/>
  <rect x="1072" y="138" width="464" height="270" rx="8" fill="#0d131d" stroke="#253044"/>

  <text x="296" y="246" text-anchor="middle" font-size="88" font-weight="850" fill="#63b3ff">2.08x</text>
  <text x="296" y="304" text-anchor="middle" font-size="29" font-weight="750" fill="#f2f7ff">經來源查核的發現</text>
  <text x="296" y="343" text-anchor="middle" font-size="25" fill="#9aabc1">每次研究執行產生</text>

  <text x="800" y="246" text-anchor="middle" font-size="82" font-weight="850" fill="#35d6a3">81.7%</text>
  <text x="800" y="304" text-anchor="middle" font-size="29" font-weight="750" fill="#f2f7ff">無根據主張被移除</text>
  <text x="800" y="343" text-anchor="middle" font-size="25" fill="#9aabc1">或在來源查核後修正</text>

  <text x="1304" y="246" text-anchor="middle" font-size="88" font-weight="850" fill="#35d6a3">100%</text>
  <text x="1304" y="304" text-anchor="middle" font-size="29" font-weight="750" fill="#f2f7ff">埋設的引用與來源</text>
  <text x="1304" y="343" text-anchor="middle" font-size="25" fill="#9aabc1">錯誤被抓出</text>

  <!-- Bottom row -->
  <rect x="64" y="448" width="720" height="280" rx="8" fill="#0d1622" stroke="#244a72"/>
  <rect x="816" y="448" width="720" height="280" rx="8" fill="#0d1622" stroke="#244a72"/>

  <text x="424" y="566" text-anchor="middle" font-size="92" font-weight="850" fill="#63b3ff">34</text>
  <text x="424" y="626" text-anchor="middle" font-size="32" font-weight="750" fill="#f2f7ff">機會獲評</text>
  <text x="424" y="668" text-anchor="middle" font-size="26" fill="#9aabc1">8/10 或以上</text>

  <text x="1176" y="566" text-anchor="middle" font-size="92" font-weight="850" fill="#35d6a3">100%</text>
  <text x="1176" y="626" text-anchor="middle" font-size="32" font-weight="750" fill="#f2f7ff">執行擁有完整的</text>
  <text x="1176" y="668" text-anchor="middle" font-size="26" fill="#9aabc1">證據紀錄</text>

</svg>
