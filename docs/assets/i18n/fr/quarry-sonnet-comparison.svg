<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img"
     aria-labelledby="sct scd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <title id="sct">Quelle réponse de recherche un évaluateur en aveugle choisirait-il ?</title>
  <desc id="scd">Paired blind evaluation on 17 real decision tasks, same Claude Sonnet 5 configuration, blind judge, a tie does not count as a Quarry win. Claude Sonnet 5 seul was preferred 12% of the time; Claude Sonnet 5 plus Quarry was preferred 88% of the time. Same product story, additional outcomes: 4.35 Pistes faibles per run; 100% of answers ont reçu un test concret d'une semaine; 8 of 8 already-existing ideas caught avant recommandation. Internal evaluation.</desc>

  <rect x="0" y="0" width="1600" height="720" rx="14" fill="#05070b"/>
  <rect x="20" y="20" width="1560" height="680" rx="12" fill="#0a0e15" stroke="#253044" stroke-width="2"/>
  <path d="M64 470H1536 M64 644H1536" stroke="#253044" stroke-width="1"/>

  <!-- headline -->
  <text x="64" y="98" font-size="48" font-weight="800" fill="#f2f7ff">Quelle réponse de recherche un évaluateur en aveugle choisirait-il ?</text>

  <!-- bar 1: Claude Sonnet 5 seul (12%) -->
  <text x="64" y="170" font-size="27" font-weight="650" fill="#9aabc1">Claude Sonnet 5 seul</text>
  <rect x="64" y="184" width="177" height="82" rx="4" fill="#334155"/>
  <text x="225" y="245" font-size="52" font-weight="800" fill="#dce7f5" text-anchor="end">12%</text>

  <!-- bar 2: Claude Sonnet 5 + Quarry (88%, winning paired result = green) -->
  <text x="64" y="326" font-size="27" font-weight="750" fill="#f2f7ff">Claude Sonnet 5 + Quarry</text>
  <rect x="64" y="338" width="1295" height="82" rx="4" fill="#1e9bff"/>
  <text x="1336" y="401" font-size="66" font-weight="800" fill="#06101d" text-anchor="end">88%</text>


  <!-- three secondary outcomes (no fabricated paired percentages) -->
  <text x="320" y="542" text-anchor="middle" font-size="48" font-weight="800" fill="#63b3ff">4.35</text>
  <text x="320" y="584" text-anchor="middle" font-size="24" fill="#dce7f5">Pistes faibles</text>
  <text x="320" y="615" text-anchor="middle" font-size="24" fill="#9aabc1">éliminées par exécution</text>

  <text x="800" y="542" text-anchor="middle" font-size="48" font-weight="800" fill="#35d6a3">100%</text>
  <text x="800" y="584" text-anchor="middle" font-size="24" fill="#dce7f5">ont reçu un</text>
  <text x="800" y="615" text-anchor="middle" font-size="24" fill="#9aabc1">test concret d'une semaine</text>

  <text x="1280" y="542" text-anchor="middle" font-size="48" font-weight="800" fill="#35d6a3">8/8</text>
  <text x="1280" y="584" text-anchor="middle" font-size="24" fill="#dce7f5">idées déjà existantes repérées</text>
  <text x="1280" y="615" text-anchor="middle" font-size="24" fill="#9aabc1">avant recommandation</text>

  <!-- method note inside the image -->
  <text x="64" y="680" font-size="23" fill="#6f819a" font-family="ui-monospace, 'SF Mono', Menlo, monospace">17 tâches de décision réelles. Même configuration Sonnet 5. Juge en aveugle. Une égalité ne compte pas comme une victoire de Quarry. Évaluation interne.</text>
</svg>
