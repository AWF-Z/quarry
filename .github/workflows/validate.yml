name: Validate public plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository
        run: python3 scripts/check_public_repo.py
      - name: Test MCP bridge
        run: python3 scripts/test_mcp_client.py
